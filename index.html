<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#C5050C" />
  <title>Word</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="vendor/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1 class="brand" aria-label="Word">
        <svg viewBox="0 0 260 50" preserveAspectRatio="xMinYMid meet" aria-hidden="true">
          <text x="2" y="44" textLength="248" lengthAdjust="spacingAndGlyphs">WORD</text>
        </svg>
      </h1>
      <!-- Little guy walking from the logo to the bar (Sam, 2026-11-18). Decoration only. -->
      <div class="street" aria-hidden="true">
        <svg class="walker" viewBox="0 0 20 32">
          <circle cx="11" cy="5" r="3.6" />
          <line class="body" x1="10.5" y1="9" x2="10" y2="19.5" />
          <line class="arm a1" x1="10.4" y1="11" x2="10.4" y2="17.5" />
          <line class="arm a2" x1="10.4" y1="11" x2="10.4" y2="17.5" />
          <line class="leg l1" x1="10" y1="19.5" x2="10" y2="30" />
          <line class="leg l2" x1="10" y1="19.5" x2="10" y2="30" />
        </svg>
        <svg class="pub" viewBox="0 0 40 32">
          <rect x="3" y="9" width="34" height="23" rx="1" />
          <rect class="cut" x="6" y="2" width="28" height="9" rx="2" />
          <rect x="7.3" y="3.3" width="25.4" height="6.4" rx="1.2" />
          <text x="20" y="8.6" text-anchor="middle">BAR</text>
          <path class="cut" d="M3 13h34v3a2.8 2.8 0 0 1-5.7 0 2.8 2.8 0 0 1-5.6 0 2.8 2.8 0 0 1-5.7 0 2.8 2.8 0 0 1-5.6 0 2.8 2.8 0 0 1-5.7 0 2.8 2.8 0 0 1-5.7 0z" />
          <rect class="cut" x="7" y="20" width="10" height="8" rx="1" />
          <rect class="cut" x="22" y="19" width="10" height="13" rx="1" />
          <path d="M9.5 21.8h4v4.6h-4z M13.5 22.6h1.3v2.8h-1.3z" />
        </svg>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="bellBtn" aria-label="Notifications">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z"/></svg>
          <span class="badge hidden" id="bellBadge">0</span>
        </button>
        <button class="icon-btn" id="gearBtn" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.5 7.5 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.5 7.5 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.5 7.5 0 0 0 1.7 1L11 21h4l.4-2.9a7.5 7.5 0 0 0 1.7-1l2.5 1 2-3.5L19.4 13ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" transform="translate(-1 0)"/></svg>
        </button>
      </div>
    </header>

    <main>
      <section id="tab-feed" class="tab active"></section>
      <section id="tab-map" class="tab">
        <div id="map"></div>
        <div class="map-legend" id="mapLegend"></div>
      </section>
      <section id="tab-friends" class="tab"></section>
      <section id="tab-settings" class="tab"></section>
      <section id="tab-profile" class="tab"></section>
      <section id="tab-thread" class="tab"></section>
    </main>

    <nav class="tabbar">
      <button data-tab="feed" class="active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg><span>Feed</span></button>
      <button data-tab="map">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg><span>Map</span></button>
      <button data-tab="friends">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm7.5 0a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7ZM1 20c0-3.3 3.6-6 8-6s8 2.7 8 6v1H1v-1Zm17.5 1v-1c0-2-1-3.8-2.6-5 3.6.2 7.1 2 7.1 5v1h-4.5Z"/></svg><span>Friends</span>
        <span class="badge hidden" id="reqBadge">0</span></button>
      <button data-tab="profile">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-9 2.2-9 5.5V22h18v-2.5c0-3.3-4.6-5.5-9-5.5Z"/></svg><span>Profile</span></button>
    </nav>

    <!-- Bottom sheet, used for the post composer and for "who's going" on the map -->
    <div id="sheetBackdrop" class="backdrop hidden"></div>
    <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"></div>

    <!-- Sign in / create account (live mode only) -->
    <div id="auth" class="auth hidden"></div>
  </div>

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="backend.js"></script>
  <script src="bars.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
