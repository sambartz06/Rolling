<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#C5050C" />
  <title>Word</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="vendor/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1 class="brand" aria-label="Word">
        <svg viewBox="0 0 260 50" preserveAspectRatio="xMinYMid meet" aria-hidden="true">
          <text x="2" y="44" textLength="248" lengthAdjust="spacingAndGlyphs">WORD</text>
        </svg>
      </h1>
      <!-- Little guy walking from the logo to the bar (Sam, 2026-11-18). Decoration only. -->
      <div class="street" aria-hidden="true">
        <svg class="walker" viewBox="0 0 24 48">
          <g class="bob">
            <!-- far arm and leg (dimmer, behind) -->
            <g class="limb arm far"><path d="M10.9 10.6h2.6l-.2 7.6h-2.2z" /><g class="fore"><path d="M11 17.8h2.1l-.3 6.4h-1.6z" /><circle cx="12" cy="24.6" r="1.1" /></g></g>
            <g class="limb leg far"><path d="M10.2 23.4h3.8l-.6 11h-2.6z" /><g class="shin"><path d="M10.8 34h2.6l-.4 9.6h-1.8z" /><path d="M10.7 43.2h2.6l2.7 1.2v1.3h-5.3z" /></g></g>
            <!-- head, neck, torso -->
            <circle cx="12.6" cy="4.4" r="3.3" />
            <path d="M11.6 7.2h2.2l.1 2.2h-2.4z" />
            <path d="M9.2 9.6c1.6-.7 4.6-.8 6.2 0l.4 6.5-.9 9h-5.3l-.9-9z" />
            <!-- near leg and arm -->
            <g class="limb leg near"><path d="M10.2 23.4h3.8l-.6 11h-2.6z" /><g class="shin"><path d="M10.8 34h2.6l-.4 9.6h-1.8z" /><path d="M10.7 43.2h2.6l2.7 1.2v1.3h-5.3z" /></g></g>
            <g class="limb arm near"><path d="M10.9 10.6h2.6l-.2 7.6h-2.2z" /><g class="fore"><path d="M11 17.8h2.1l-.3 6.4h-1.6z" /><circle cx="12" cy="24.6" r="1.1" /></g></g>
          </g>
        </svg>
        <svg class="pub" viewBox="0 0 60 44">
          <!-- facade with brick courses -->
          <rect class="wall" x="3" y="6" width="54" height="38" />
          <g class="bricks">
            <path d="M3 9.5h54M3 13h54M3 16.5h54" />
            <path d="M9 6v3.5M19 6v3.5M29 6v3.5M39 6v3.5M49 6v3.5M14 9.5V13M24 9.5V13M34 9.5V13M44 9.5V13M54 9.5V13M9 13v3.5M19 13v3.5M29 13v3.5M39 13v3.5M49 13v3.5" />
          </g>
          <rect class="wall" x="1" y="3" width="58" height="3.4" rx=".8" />
          <!-- neon sign -->
          <rect class="sign" x="17" y="7.4" width="26" height="9.2" rx="2.2" />
          <text x="30" y="14.6" text-anchor="middle">BAR</text>
          <!-- striped awning -->
          <path class="awn-a" d="M2 18h56l-2 5H4z" />
          <path class="awn-b" d="M9 18h7l-.6 5h-6.8zM23 18h7l-.2 5h-6.8zM37 18h7l.2 5h-6.8zM51 18h7l-2 5h-4.6z" />
          <path class="awn-a" d="M4 23h52v1.4a2.2 2.2 0 0 1-4.3 0 2.2 2.2 0 0 1-4.4 0 2.2 2.2 0 0 1-4.3 0 2.2 2.2 0 0 1-4.4 0 2.2 2.2 0 0 1-4.3 0 2.2 2.2 0 0 1-4.3 0 2.2 2.2 0 0 1-4.4 0 2.2 2.2 0 0 1-4.3 0 2.2 2.2 0 0 1-4.4 0 2.2 2.2 0 0 1-4.3 0 2.2 2.2 0 0 1-4.3 0 2.2 2.2 0 0 1-4.4 0z" />
          <!-- lit window with two drinkers' mugs -->
          <rect class="frame" x="6" y="27" width="22" height="12" rx="1" />
          <rect class="glow" x="7.4" y="28.4" width="19.2" height="9.2" />
          <path class="frame" d="M16.3 28.4h1.4v9.2h-1.4z" />
          <path class="mugs" d="M9.5 32.6h3v3.6h-3zM12.5 33.3h.9v2h-.9zM20.3 31.8h3v4.4h-3zM23.3 32.6h.9v2.2h-.9z" />
          <!-- door, lamp, step -->
          <rect class="frame" x="35" y="26.5" width="13" height="17.5" rx="1" />
          <rect class="glow" x="37.6" y="28.8" width="7.8" height="5.6" rx=".6" />
          <circle class="wall" cx="45.6" cy="36.6" r=".9" />
          <path class="wall" d="M51.6 27.5h2.6l-.4 3.2h-1.8z" />
          <circle class="glow" cx="52.9" cy="31.4" r="1.2" />
          <rect class="wall" x="33.5" y="42.4" width="16" height="1.6" />
        </svg>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="bellBtn" aria-label="Notifications">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z"/></svg>
          <span class="badge hidden" id="bellBadge">0</span>
        </button>
        <button class="icon-btn" id="gearBtn" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.5 7.5 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.5 7.5 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.5 7.5 0 0 0 1.7 1L11 21h4l.4-2.9a7.5 7.5 0 0 0 1.7-1l2.5 1 2-3.5L19.4 13ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" transform="translate(-1 0)"/></svg>
        </button>
      </div>
    </header>

    <main>
      <section id="tab-feed" class="tab active"></section>
      <section id="tab-map" class="tab">
        <div id="map"></div>
        <div class="map-legend" id="mapLegend"></div>
      </section>
      <section id="tab-friends" class="tab"></section>
      <section id="tab-settings" class="tab"></section>
      <section id="tab-profile" class="tab"></section>
      <section id="tab-thread" class="tab"></section>
    </main>

    <nav class="tabbar">
      <button data-tab="feed" class="active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg><span>Feed</span></button>
      <button data-tab="map">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg><span>Map</span></button>
      <button data-tab="friends">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm7.5 0a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7ZM1 20c0-3.3 3.6-6 8-6s8 2.7 8 6v1H1v-1Zm17.5 1v-1c0-2-1-3.8-2.6-5 3.6.2 7.1 2 7.1 5v1h-4.5Z"/></svg><span>Friends</span>
        <span class="badge hidden" id="reqBadge">0</span></button>
      <button data-tab="profile">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-9 2.2-9 5.5V22h18v-2.5c0-3.3-4.6-5.5-9-5.5Z"/></svg><span>Profile</span></button>
    </nav>

    <!-- Bottom sheet, used for the post composer and for "who's going" on the map -->
    <div id="sheetBackdrop" class="backdrop hidden"></div>
    <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"></div>

    <!-- Sign in / create account (live mode only) -->
    <div id="auth" class="auth hidden"></div>
  </div>

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="backend.js"></script>
  <script src="bars.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
